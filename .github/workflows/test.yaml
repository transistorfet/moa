name: test
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  RUSTFLAGS: '--deny warnings'
  RUSTVERSION: 1.90

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y alsa-base libasound2-dev libxkbcommon-dev

      - name: Select rust version
        run: |
          rustup toolchain install $RUSTVERSION --profile minimal --no-self-update
          rustup default $RUSTVERSION

      - name: Run tests with default features
        run: |
          cargo test --workspace

      - name: Run tests with all features
        run: |
          cargo test --workspace #--features=std,fugit,femtos

      - name: Run test with no_std
        run: |
          cargo test --workspace --no-default-features


